plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
}

// Optional client integration. Only API classes are used for compilation; JEI is never bundled.
def jeiVersion = '15.20.0.106'
dependencies {
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jeiVersion}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jeiVersion}")
    if (project.findProperty('jeiCompat') == 'true') {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jeiVersion}")
    }
}

// Optional real-mod compatibility run: -PtaczCompat=true. Never bundled into CsgoBox.
if (project.findProperty('taczCompat') == 'true') {
    repositories {
        maven { url 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    }
    dependencies { runtimeOnly fg.deobf('curse.maven:timeless-and-classics-zero-1028108:9037989') }
    minecraft.runs.configureEach {
        property 'csgobox.taczCompat', 'true'
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test) { useJUnitPlatform() }

tasks.named('processResources', ProcessResources).configure {
    def properties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand properties + [project: project] }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { into 'META-INF' }
    // Runtime regression fixtures belong to the development environment, not the distributed mod.
    exclude 'com/reclizer/csgobox/gametest/**', 'data/csgobox/structures/empty.nbt'
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
